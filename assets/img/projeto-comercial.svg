<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="1800" height="1000" role="img" aria-label="Ilustração de espaço comercial planejado com balcão de recepção, painel de marca, armários de atendimento e vitrine" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="comWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0F6F7"/><stop offset="1" stop-color="#CCDCDF"/></linearGradient>
    <linearGradient id="comFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8DEDF"/><stop offset="1" stop-color="#BBC6C8"/></linearGradient>
    <linearGradient id="comCab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#113B45"/><stop offset="1" stop-color="#0A2A31"/></linearGradient>
    <linearGradient id="comWood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DCBF9A"/><stop offset="1" stop-color="#C19C70"/></linearGradient>
    <linearGradient id="comStone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBFDFD"/><stop offset="1" stop-color="#E0EAEC"/></linearGradient>
    <linearGradient id="comGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A9DCE3" stop-opacity=".4"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".18"/></linearGradient>
    <linearGradient id="comShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient>
    <linearGradient id="comUnder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B2A31" stop-opacity=".3"/><stop offset="1" stop-color="#0B2A31" stop-opacity="0"/></linearGradient>
  </defs>

  <rect width="1800" height="1000" fill="url(#comWall)"/>
  <rect y="800" width="1800" height="200" fill="url(#comFloor)"/>
  <path d="M0 860h1800M0 930h1800" stroke="#0A2A31" stroke-opacity=".07" stroke-width="6"/>

  <!-- Vitrine -->
  <rect x="1240" y="90" width="500" height="710" rx="10" fill="url(#comGlass)"/>
  <rect x="1240" y="90" width="500" height="710" rx="10" fill="none" stroke="#0A2A31" stroke-opacity=".3" stroke-width="12"/>
  <path d="M1490 90v710" stroke="#0A2A31" stroke-opacity=".22" stroke-width="10"/>

  <!-- Painel de marca atrás da recepção -->
  <rect x="80" y="90" width="820" height="480" rx="12" fill="url(#comWood)"/>
  <g stroke="#0A2A31" stroke-opacity=".14" stroke-width="7">
    <path d="M140 100v460M200 100v460M260 100v460M320 100v460M380 100v460M440 100v460M500 100v460M560 100v460M620 100v460M680 100v460M740 100v460M800 100v460M860 100v460"/>
  </g>
  <rect x="300" y="240" width="380" height="110" rx="10" fill="#0A2A31" opacity=".85"/>
  <rect x="340" y="276" width="170" height="16" rx="8" fill="#A9DCE3" opacity=".9"/>
  <rect x="340" y="306" width="110" height="12" rx="6" fill="#FFFFFF" opacity=".6"/>
  <rect x="60" y="74" width="860" height="14" rx="7" fill="#A9DCE3" opacity=".8"/>

  <!-- Balcão de recepção -->
  <rect x="140" y="580" width="700" height="44" rx="8" fill="url(#comStone)"/>
  <rect x="170" y="624" width="640" height="200" rx="10" fill="url(#comCab)"/>
  <rect x="170" y="624" width="640" height="200" rx="10" fill="url(#comShade)"/>
  <rect x="170" y="660" width="640" height="18" fill="#A9DCE3" opacity=".3"/>
  <path d="M490 632v184" stroke="#A9DCE3" stroke-opacity=".28" stroke-width="5"/>
  <rect x="170" y="824" width="640" height="46" fill="url(#comUnder)"/>

  <!-- Armários de atendimento -->
  <rect x="940" y="300" width="250" height="520" rx="12" fill="url(#comCab)"/>
  <rect x="940" y="300" width="250" height="520" rx="12" fill="url(#comShade)"/>
  <path d="M940 470h250M940 640h250" stroke="#A9DCE3" stroke-opacity=".26" stroke-width="5"/>
  <rect x="1000" y="400" width="130" height="12" rx="6" fill="#A9DCE3" opacity=".55"/>
  <rect x="1000" y="570" width="130" height="12" rx="6" fill="#A9DCE3" opacity=".55"/>
  <rect x="1000" y="740" width="130" height="12" rx="6" fill="#A9DCE3" opacity=".55"/>

  <!-- Expositor iluminado na vitrine -->
  <rect x="1300" y="400" width="370" height="26" rx="8" fill="url(#comWood)"/>
  <rect x="1300" y="560" width="370" height="26" rx="8" fill="url(#comWood)"/>
  <rect x="1300" y="386" width="370" height="8" rx="4" fill="#A9DCE3" opacity=".8"/>
  <rect x="1300" y="546" width="370" height="8" rx="4" fill="#A9DCE3" opacity=".8"/>
  <g fill="#0A2A31" opacity=".3">
    <rect x="1340" y="330" width="60" height="70" rx="8"/>
    <rect x="1440" y="348" width="54" height="52" rx="8"/>
    <rect x="1540" y="320" width="66" height="80" rx="8"/>
    <rect x="1350" y="500" width="58" height="60" rx="8"/>
    <rect x="1460" y="486" width="62" height="74" rx="8"/>
    <rect x="1570" y="508" width="56" height="52" rx="8"/>
  </g>

  <!-- Banquetas de espera -->
  <g fill="#A9DCE3">
    <circle cx="960" cy="880" r="38"/>
    <circle cx="1080" cy="880" r="38"/>
  </g>
  <g stroke="#0A2A31" stroke-opacity=".32" stroke-width="10" stroke-linecap="round">
    <path d="M960 918v58M1080 918v58"/>
  </g>

  <rect width="1800" height="1000" fill="url(#comShade)" opacity=".5"/>
</svg>
